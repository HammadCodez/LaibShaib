<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none" role="img" aria-label="LabShaib Concept 1: Signal Reticle">
  <!-- Concept 1: The Oscilloscope Signal Reticle -->
  <!-- Circular Precision Scope Display (48x48) -->
  <g transform="translate(6, 6)">
    <!-- Scope Outer Bezel / Reticle -->
    <circle cx="24" cy="24" r="22" stroke="#002D62" stroke-width="2" fill="#f8fafc" />
    
    <!-- Reticle Crosshairs & Grid Lines -->
    <line x1="24" y1="4" x2="24" y2="44" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="4" y1="24" x2="44" y2="24" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="24" cy="24" r="14" stroke="#e2e8f0" stroke-width="1" fill="none" />

    <!-- 4 Scope Corner Calibration Marks -->
    <path d="M 10 10 H 6 V 14" stroke="#002D62" stroke-width="1.5" />
    <path d="M 38 10 H 42 V 14" stroke="#002D62" stroke-width="1.5" />
    <path d="M 10 38 H 6 V 34" stroke="#002D62" stroke-width="1.5" />
    <path d="M 38 38 H 42 V 34" stroke="#002D62" stroke-width="1.5" />

    <!-- Active Oscilloscope Waveform (Teal Pulse) -->
    <path d="M 6 24 H 14 L 18 13 L 23 34 L 27 18 L 31 24 H 42" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Leading Signal Node / Laser Point -->
    <circle cx="31" cy="24" r="2.5" fill="#0d9488" />
  </g>

  <!-- Typography -->
  <text x="66" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#002D62" letter-spacing="-0.5">Lab<tspan fill="#0d9488">Shaib</tspan></text>
  <text x="67" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#64748b" letter-spacing="1.5">TEST &amp; MEASUREMENT SUITE</text>
</svg>
